<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation Spin the Wheel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Fredoka One', cursive;
            letter-spacing: 1px;
        }

        .wheel-container {
            position: relative;
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 1;
            margin: 0 auto;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 3s cubic-bezier(0.17, 0.67, 0.1, 1);
            border: 8px solid white;
            box-sizing: border-box;
            background-color: white; /* Fallback */
        }

        .wheel-marker {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #ef4444; /* Tailwind red-500 */
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .prompt-card {
            animation: popIn 0.5s cubic-bezier(0.17, 0.67, 0.83, 1.2) forwards;
            display: none; /* Hidden by default */
        }
        
        .prompt-card.active {
            display: flex;
        }

        .btn-primary {
            background-color: #4f46e5; /* indigo-600 */
            color: white;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4), 0 2px 4px -1px rgba(79, 70, 229, 0.2);
        }
        .btn-primary:hover {
            background-color: #4338ca; /* indigo-700 */
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4), 0 4px 6px -2px rgba(79, 70, 229, 0.2);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-primary:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

    </style>
</head>

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            const sliceAngle = (2 * Math.PI) / gameData.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < gameData.length; i++) {
                // Draw slice
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.closePath();
                ctx.fillStyle = gameData[i].color;
                ctx.fill();
                
                // Add border to slices
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Draw text
                ctx.save();
                ctx.translate(centerX, centerY);
                // Rotate to center of slice
                ctx.rotate(i * sliceAngle + sliceAngle / 2);
                
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px "Nunito"';
                
                // Shadow for text readability
                ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                // Move text towards outer edge
                ctx.fillText(gameData[i].name, radius - 30, 0);
                
                ctx.restore();
            }
            
            // Draw center circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#e5e7eb'; // gray-200
            ctx.stroke();
            
            // Draw center dot
            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, 2 * Math.PI);
            ctx.fillStyle = '#4f46e5'; // indigo-600
            ctx.fill();
        }

        function spin() {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Spinning...';
            
            // Hide previous prompt if exists, show placeholder temporarily
            promptArea.classList.remove('active');
            placeholder.style.display = 'block';
            translationArea.classList.add('hidden'); // Reset translation

            // Calculate rotation
            // Add minimum 5 full rotations (1800 deg) + random extra rotation
            const minSpins = 5;
            const extraDegrees = Math.floor(Math.random() * 360);
            const totalDegreesToSpin = (minSpins * 360) + extraDegrees;
            
            currentRotation += totalDegreesToSpin;

            // Apply rotation via CSS transform
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Wait for transition to end (matches CSS transition time 3s)
            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.innerHTML = '<i class="fas fa-sync-alt mr-2"></i> SPIN AGAIN!';
                
                determineResult();
            }, 3000); // 3000ms = 3s
        }

        function determineResult() {
            // The marker is at the top (0 degrees or 270 degrees in canvas coordinates, 
            // but CSS rotate turns the canvas visually).
            // We need to find what slice is at the top position.
            
            // CSS rotate() turns clockwise. 
            // 0deg on canvas is at 3 o'clock. Top marker is at 12 o'clock (-90deg relative to canvas 0deg).
            
            // Total visual rotation normalized to 0-360
            const normalizedRotation = currentRotation % 360;
            
            // Because the canvas rotates clockwise, the point at 12 o'clock moves *backwards* 
            // through the slices (drawn clockwise starting from 3 o'clock).
            
            const sliceAngle = 360 / gameData.length;
            
            // Adjust for canvas starting angle (slice 0 starts at 3 o'clock, top is -90 from that)
            // To find the slice at the top:
            // Calculate how far the wheel has turned backwards from the top marker
            let degreesFromTop = (270 - normalizedRotation) % 360;
            if (degreesFromTop < 0) degreesFromTop += 360;

            // Determine index
            currentCategoryIndex = Math.floor(degreesFromTop / sliceAngle);
            
            showPrompt();
        }

        function showPrompt() {
            const category = gameData[currentCategoryIndex];
            
            // Select a random prompt from the category
            currentPromptIndex = Math.floor(Math.random() * category.prompts.length);
            const prompt = category.prompts[currentPromptIndex];

            // Update DOM
            placeholder.style.display = 'none';
            promptArea.classList.add('active');
            
            categoryLabel.textContent = category.name;
            categoryLabel.style.backgroundColor = category.color;
            
            categoryIcon.className = `absolute -top-4 -right-4 text-8xl opacity-10 fas ${category.icon}`;
            categoryIcon.style.color = category.color;

            englishPrompt.textContent = prompt.en;
            chinesePrompt.textContent = prompt.zh;
            
            // Reset UI states
            translationArea.classList.add('hidden');
            translateBtn.innerHTML = '<i class="fas fa-language text-lg mr-2"></i> Translate';
            translateBtn.classList.remove('text-gray-500');
            translateBtn.classList.add('text-indigo-600');
            
            // Show next question button if category has more than 1 question
            if (category.prompts.length > 1) {
                nextQuestionBtn.classList.remove('hidden');
            } else {
                nextQuestionBtn.classList.add('hidden');
            }
        }

        function toggleTranslation() {
            if (translationArea.classList.contains('hidden')) {
                translationArea.classList.remove('hidden');
                translateBtn.innerHTML = '<i class="fas fa-eye-slash text-lg mr-2"></i> Hide Translation';
                translateBtn.classList.remove('text-indigo-600');
                translateBtn.classList.add('text-gray-500');
            } else {
                translationArea.classList.add('hidden');
                translateBtn.innerHTML = '<i class="fas fa-language text-lg mr-2"></i> Translate';
                translateBtn.classList.remove('text-gray-500');
                translateBtn.classList.add('text-indigo-600');
            }
        }

        function showNextQuestion() {
            const category = gameData[currentCategoryIndex];
            
            // Pick a different question
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * category.prompts.length);
            } while (nextIndex === currentPromptIndex && category.prompts.length > 1);
            
            currentPromptIndex = nextIndex;
            const prompt = category.prompts[currentPromptIndex];
            
            // Add a small animation to text change
            englishPrompt.style.opacity = 0;
            if(!translationArea.classList.contains('hidden')) {
                chinesePrompt.style.opacity = 0;
            }
            
            setTimeout(() => {
                englishPrompt.textContent = prompt.en;
                chinesePrompt.textContent = prompt.zh;
                
                englishPrompt.style.transition = 'opacity 0.3s ease';
                chinesePrompt.style.transition = 'opacity 0.3s ease';
                
                englishPrompt.style.opacity = 1;
                chinesePrompt.style.opacity = 1;
            }, 300);
        }

        // Event Listeners
        spinBtn.addEventListener('click', spin);
        translateBtn.addEventListener('click', toggleTranslation);
        nextQuestionBtn.addEventListener('click', showNextQuestion);

        // Fix for iOS Safari to ensure audio/animations work perfectly on tap
        document.body.addEventListener('touchstart', function() {}, false);

        // Initialize
        window.onload = () => {
            drawWheel();
            // Trigger a redraw if window resizes to ensure it scales correctly though CSS handles most of it
            window.addEventListener('resize', drawWheel);
        };

    </script>
