<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation Spin the Wheel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Fredoka One', cursive;
            letter-spacing: 1px;
        }

        .wheel-container {
            position: relative;
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 1;
            margin: 0 auto;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 3s cubic-bezier(0.17, 0.67, 0.1, 1);
            border: 8px solid white;
            box-sizing: border-box;
            background-color: white; /* Fallback */
        }

        .wheel-marker {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #ef4444; /* Tailwind red-500 */
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .prompt-card {
            animation: popIn 0.5s cubic-bezier(0.17, 0.67, 0.83, 1.2) forwards;
            display: none; /* Hidden by default */
        }
        
        .prompt-card.active {
            display: flex;
        }

        .btn-primary {
            background-color: #4f46e5; /* indigo-600 */
            color: white;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4), 0 2px 4px -1px rgba(79, 70, 229, 0.2);
        }
        .btn-primary:hover {
            background-color: #4338ca; /* indigo-700 */
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4), 0 4px 6px -2px rgba(79, 70, 229, 0.2);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-primary:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

    </style>
</head>
<body class="text-gray-800 p-4 sm:p-8">

    <header class="text-center mb-8">
        <h1 class="text-4xl sm:text-5xl md:text-6xl text-white drop-shadow-md mb-2">Let's Talk!</h1>
        <p class="text-lg text-white font-semibold opacity-90">Spin the wheel to get a conversation topic.</p>
    </header>

    <main class="flex-grow flex flex-col md:flex-row items-center justify-center gap-8 md:gap-16 max-w-6xl mx-auto w-full">
        
        <div class="flex flex-col items-center w-full md:w-1/2">
            <div class="wheel-container mb-6">
                <div class="wheel-marker"></div>
                <canvas id="wheelCanvas" width="500" height="500"></canvas>
            </div>
            
            <button id="spinBtn" class="btn-primary brand-font text-2xl py-3 px-12 rounded-full border-4 border-indigo-300">
                <i class="fas fa-sync-alt mr-2"></i> SPIN!
            </button>
        </div>

        <div class="w-full md:w-1/2 flex flex-col justify-center items-center min-h-[300px]">
            
            <!-- Default placeholder before spinning -->
            <div id="placeholder" class="text-center bg-white/50 backdrop-blur-sm p-8 rounded-2xl border-2 border-white/60 shadow-xl w-full max-w-md">
                <i class="fas fa-comments text-6xl text-indigo-400 mb-4 opacity-50"></i>
                <h2 class="text-2xl text-gray-700">Ready to chat?</h2>
                <p class="text-gray-500 mt-2">Click SPIN to find out what we're talking about today!</p>
            </div>

            <div id="promptArea" class="prompt-card flex-col bg-white p-6 sm:p-8 rounded-3xl shadow-2xl border-4 border-white w-full max-w-md relative overflow-hidden">
                <div id="categoryIcon" class="absolute -top-4 -right-4 text-8xl opacity-10"></div>
                
                <div class="relative z-10 flex flex-col h-full">
                    <div class="mb-4 inline-block">
                        <span id="categoryLabel" class="brand-font text-sm uppercase tracking-wider px-3 py-1 rounded-full text-white bg-indigo-500 shadow-sm">
                            Category
                        </span>
                    </div>
                    
                    <h3 id="englishPrompt" class="text-2xl sm:text-3xl font-bold text-gray-800 leading-tight mb-6 flex-grow">
                        Question goes here?
                    </h3>
                    
                    <div id="translationArea" class="hidden mb-6 p-4 bg-yellow-50 rounded-xl border border-yellow-200">
                        <p class="text-sm font-bold text-yellow-800 mb-1">Traditional Chinese (繁體中文):</p>
                        <p id="chinesePrompt" class="text-lg text-gray-700 font-medium">
                            中文翻譯在這裡。
                        </p>
                    </div>
                    
                    <div class="flex justify-between items-center mt-auto border-t border-gray-100 pt-4">
                        <button id="translateBtn" class="flex items-center text-sm font-bold text-indigo-600 hover:text-indigo-800 transition-colors">
                            <i class="fas fa-language text-lg mr-2"></i> 
                            <span id="translateText">Translate</span>
                        </button>
                        
                        <button id="nextQuestionBtn" class="flex items-center text-sm font-bold text-gray-500 hover:text-gray-800 transition-colors hidden">
                            Next Question <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center mt-8 text-white/80 text-sm">
        <p>Practice makes perfect! Enjoy your conversation.</p>
    </footer>

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const placeholder = document.getElementById('placeholder');
        const promptArea = document.getElementById('promptArea');
        const categoryLabel = document.getElementById('categoryLabel');
        const categoryIcon = document.getElementById('categoryIcon');
        const englishPrompt = document.getElementById('englishPrompt');
        const translationArea = document.getElementById('translationArea');
        const chinesePrompt = document.getElementById('chinesePrompt');
        const translateBtn = document.getElementById('translateBtn');
        const translateText = document.getElementById('translateText');
        const nextQuestionBtn = document.getElementById('nextQuestionBtn');

        // State variables
        let currentRotation = 0;
        let isSpinning = false;
        let currentCategoryIndex = -1;
        let currentPromptIndex = -1;

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            const sliceAngle = (2 * Math.PI) / gameData.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < gameData.length; i++) {
                // Draw slice
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.closePath();
                ctx.fillStyle = gameData[i].color;
                ctx.fill();
                
                // Add border to slices
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Draw text
                ctx.save();
                ctx.translate(centerX, centerY);
                // Rotate to center of slice
                ctx.rotate(i * sliceAngle + sliceAngle / 2);
                
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px "Nunito"';
                
                // Shadow for text readability
                ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                // Move text towards outer edge
                ctx.fillText(gameData[i].name, radius - 30, 0);
                
                ctx.restore();
            }
            
            // Draw center circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#e5e7eb'; // gray-200
            ctx.stroke();
            
            // Draw center dot
            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, 2 * Math.PI);
            ctx.fillStyle = '#4f46e5'; // indigo-600
            ctx.fill();
        }

        function spin() {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Spinning...';
            
            // Hide previous prompt if exists, show placeholder temporarily
            promptArea.classList.remove('active');
            placeholder.style.display = 'block';
            translationArea.classList.add('hidden'); // Reset translation

            // Calculate rotation
            // Add minimum 5 full rotations (1800 deg) + random extra rotation
            const minSpins = 5;
            const extraDegrees = Math.floor(Math.random() * 360);
            const totalDegreesToSpin = (minSpins * 360) + extraDegrees;
            
            currentRotation += totalDegreesToSpin;

            // Apply rotation via CSS transform
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Wait for transition to end (matches CSS transition time 3s)
            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.innerHTML = '<i class="fas fa-sync-alt mr-2"></i> SPIN AGAIN!';
                
                determineResult();
            }, 3000); // 3000ms = 3s
        }

        function determineResult() {
            // The marker is at the top (0 degrees or 270 degrees in canvas coordinates, 
            // but CSS rotate turns the canvas visually).
            // We need to find what slice is at the top position.
            
            // CSS rotate() turns clockwise. 
            // 0deg on canvas is at 3 o'clock. Top marker is at 12 o'clock (-90deg relative to canvas 0deg).
            
            // Total visual rotation normalized to 0-360
            const normalizedRotation = currentRotation % 360;
            
            // Because the canvas rotates clockwise, the point at 12 o'clock moves *backwards* 
            // through the slices (drawn clockwise starting from 3 o'clock).
            
            const sliceAngle = 360 / gameData.length;
            
            // Adjust for canvas starting angle (slice 0 starts at 3 o'clock, top is -90 from that)
            // To find the slice at the top:
            // Calculate how far the wheel has turned backwards from the top marker
            let degreesFromTop = (270 - normalizedRotation) % 360;
            if (degreesFromTop < 0) degreesFromTop += 360;

            // Determine index
            currentCategoryIndex = Math.floor(degreesFromTop / sliceAngle);
            
            showPrompt();
        }

        function showPrompt() {
            const category = gameData[currentCategoryIndex];
            
            // Select a random prompt from the category
            currentPromptIndex = Math.floor(Math.random() * category.prompts.length);
            const prompt = category.prompts[currentPromptIndex];

            // Update DOM
            placeholder.style.display = 'none';
            promptArea.classList.add('active');
            
            categoryLabel.textContent = category.name;
            categoryLabel.style.backgroundColor = category.color;
            
            categoryIcon.className = `absolute -top-4 -right-4 text-8xl opacity-10 fas ${category.icon}`;
            categoryIcon.style.color = category.color;

            englishPrompt.textContent = prompt.en;
            chinesePrompt.textContent = prompt.zh;
            
            // Reset UI states
            translationArea.classList.add('hidden');
            translateBtn.innerHTML = '<i class="fas fa-language text-lg mr-2"></i> Translate';
            translateBtn.classList.remove('text-gray-500');
            translateBtn.classList.add('text-indigo-600');
            
            // Show next question button if category has more than 1 question
            if (category.prompts.length > 1) {
                nextQuestionBtn.classList.remove('hidden');
            } else {
                nextQuestionBtn.classList.add('hidden');
            }
        }

        function toggleTranslation() {
            if (translationArea.classList.contains('hidden')) {
                translationArea.classList.remove('hidden');
                translateBtn.innerHTML = '<i class="fas fa-eye-slash text-lg mr-2"></i> Hide Translation';
                translateBtn.classList.remove('text-indigo-600');
                translateBtn.classList.add('text-gray-500');
            } else {
                translationArea.classList.add('hidden');
                translateBtn.innerHTML = '<i class="fas fa-language text-lg mr-2"></i> Translate';
                translateBtn.classList.remove('text-gray-500');
                translateBtn.classList.add('text-indigo-600');
            }
        }

        function showNextQuestion() {
            const category = gameData[currentCategoryIndex];
            
            // Pick a different question
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * category.prompts.length);
            } while (nextIndex === currentPromptIndex && category.prompts.length > 1);
            
            currentPromptIndex = nextIndex;
            const prompt = category.prompts[currentPromptIndex];
            
            // Add a small animation to text change
            englishPrompt.style.opacity = 0;
            if(!translationArea.classList.contains('hidden')) {
                chinesePrompt.style.opacity = 0;
            }
            
            setTimeout(() => {
                englishPrompt.textContent = prompt.en;
                chinesePrompt.textContent = prompt.zh;
                
                englishPrompt.style.transition = 'opacity 0.3s ease';
                chinesePrompt.style.transition = 'opacity 0.3s ease';
                
                englishPrompt.style.opacity = 1;
                chinesePrompt.style.opacity = 1;
            }, 300);
        }

        // Event Listeners
        spinBtn.addEventListener('click', spin);
        translateBtn.addEventListener('click', toggleTranslation);
        nextQuestionBtn.addEventListener('click', showNextQuestion);

        // Fix for iOS Safari to ensure audio/animations work perfectly on tap
        document.body.addEventListener('touchstart', function() {}, false);

        // Initialize
        window.onload = () => {
            drawWheel();
            // Trigger a redraw if window resizes to ensure it scales correctly though CSS handles most of it
            window.addEventListener('resize', drawWheel);
        };

    </script>
</body>
</html>
